<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Season Result</title>

<link href="https://fonts.googleapis.com/css2?family=Chewy&display=swap" rel="stylesheet">

<style>
    body {
        margin: 0;
        padding: 0;
        background: #FFDCE7;
        font-family: 'Chewy', cursive;
        display: flex;
        flex-direction: column;
        align-items: center;
        color: #7A3A2C;
    }

    h1 {
        font-size: 50px;
        margin-top: 10px;
        color: #FF7F99;
        text-shadow: 2px 2px #ffb4c9;
        letter-spacing: 3px;
    }

    .container {
        margin-top: 0.15px;
        width: 100%;
        max-width: 1200px;
        display: flex;
        gap: 40px;
    }

    .box {
        background: #FFCCCB;
        padding: 10px;
        border-radius: 35px;
        width: 55%;
        box-shadow: 0 6px 15px rgba(0,0,0,0.15);
        font-size: 19px;
        line-height: 1.5;
    }

    .box span {
        font-weight: bold;
    }

    .palette {
        width: 45%;
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
        justify-content: center;
    }

    .color-item {
        text-align: center;
        font-size: 16px;
    }

    .circle {
        width: 85px;
        height: 85px;
        border-radius: 50%;
        box-shadow: 0 5px 12px rgba(0,0,0,0.25);
        margin-bottom: 5px;
    }

    .btn-area {
        margin-top: 40px;
        display: flex;
        gap: 20px;
        flex-wrap: wrap;
        justify-content: center;
    }

    .btn {
        padding: 15px 40px;
        border-radius: 40px;
        border: none;
        cursor: pointer;
        font-size: 20px;
        color: #fff;
        box-shadow: 0 6px rgba(0,0,0,0.2);
        transition: 0.2s;
        font-family: 'Chewy', cursive;
    }

    .btn:active {
        transform: translateY(4px);
        box-shadow: 0 2px rgba(0,0,0,0.2);
    }

    .view { background: #8AD4C1; }
    .retake { background: #496785; }
    .delete { background: #E94A4A; }
    .pdf { background: #F39BC2; }
    .docx { background: #A8D0FF; }
</style>
</head>
<body>

<h1 id="titleText">YOUR PERSONAL COLOUR RESULT</h1>

<div class="container">
    <div class="box" id="infoBox">
        <p><span>Season:</span> <span id="seasonValue">-</span></p>
        <p><span>Skin Tone:</span> <span id="toneValue">-</span></p>

        <p><span>Recommended Colours:</span><br>
        <span id="color-text">-</span></p>

        <p><span>Makeup Recommendation:</span><br>
        <span id="makeup-text">-</span></p>

        <p><span>Palette:</span><br>
        <span id="palette-text">-</span></p>
    </div>

    <div class="palette" id="paletteBox"></div>
</div>

<div class="btn-area">
    <button class="btn view" onclick="goHistory()">VIEW HISTORY</button>
    <button class="btn retake" onclick="window.location.href='/cam_test'">Retake</button>
    <button class="btn delete" onclick="deleteHistory()">DELETE HISTORY</button>
</div>

<script>
// Ambil data dari localStorage
const season = localStorage.getItem("result_season") || "-";
const tone = localStorage.getItem("result_tone") || "-";

// Tampilkan ke HTML
document.getElementById("seasonValue").innerText = season;
document.getElementById("toneValue").innerText = tone;


// Mapping rekomendasi
const COLOR_RECOMMENDATION = {
    "Spring": "Warm Peach, Light Coral, Cream Yellow",
    "Summer": "Dusty Pink, Lavender, Misty Blue",
    "Autumn": "Terracotta, Olive, Mustard",
    "Winter": "Burgundy, Emerald, Icy Blue",
    "Neutral": "Beige, Taupe, Soft Brown"
};

const MAKEUP_RECOMMENDATION = {
    "Spring": "Peach Blush, Coral Lipstick",
    "Summer": "Rosy Blush, Soft Pink Lip",
    "Autumn": "Bronze Blush, Brick Red Lip",
    "Winter": "Plum Blush, Deep Red Lip",
    "Neutral": "Nude Blush, Mauve Lip"
};

const PALETTE = {
    "Spring": [
        "#FFB997", "#FFC8A2", "#FFE5B9", "#FFD9A5", "#FFBC8F",
        "#FFE3C8", "#F9C8A7", "#FFD4B2", "#FFF0D1", "#FFCA9A"
    ],

    "Summer": [
        "#E4C1F9", "#B5EAEA", "#EDF6F9", "#C6DEF1", "#D7E3FC",
        "#D6CDEA", "#C4E2FF", "#E1D9F8", "#C3E0E5", "#E9F1FA"
    ],

    "Autumn": [
        "#C97C5D", "#A68A64", "#6B705C", "#B36A5E", "#8C6A4A",
        "#9C6644", "#7F6742", "#C08A5C", "#A47551", "#8B5E3C"
    ],

    "Winter": [
        "#6A4C93", "#1982C4", "#8AC926", "#3A0CA3", "#4361EE",
        "#7209B7", "#4895EF", "#4CC9F0", "#0B1B4F", "#142850"
    ],

    "Neutral": [
        "#E0C9A6", "#C8B6A6", "#A68F7B", "#D7C2AC", "#BFAF9F",
        "#CBBBA0", "#B39A87", "#D8CFC4", "#C5B8A5", "#A89580"
    ]
};


// Isi rekomendasi ke HTML
document.getElementById("color-text").innerText = COLOR_RECOMMENDATION[season] || "-";
document.getElementById("makeup-text").innerText = MAKEUP_RECOMMENDATION[season] || "-";
document.getElementById("palette-text").innerText = PALETTE[season] ? PALETTE[season].join(", ") : "-";


// Generate Palette Circle
const paletteBox = document.getElementById("paletteBox");

if (PALETTE[season]) {
    PALETTE[season].forEach(col => {
        let div = document.createElement("div");
        div.className = "color-item";
        div.innerHTML = `
            <div class="circle" style="background:${col}"></div>
            <div>${col}</div>
        `;
        paletteBox.appendChild(div);
    });
}


// Button Function
function goHistory(){
    window.location.href = "history.html";
}

function retakePhoto() {
    document.getElementById("retakeBtn").addEventListener("click", () => {
        if (MODE === "undertone") {
            window.location.href = "/camera?mode=undertone";
        } else if (MODE === "personal") {
            window.location.href = "/camera?mode=personal";
        } else {
            // fallback kalau tidak ada mode
            window.location.href = "/cam_test";
        }
    });
}
retakePhoto();


function deleteHistory(){
    localStorage.clear();
    alert("History deleted!");
    window.location.href = "cam_tes.html?mode=season";
}
</script>
</body>
</html>
