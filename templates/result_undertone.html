<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Undertone Result</title>

<link href="https://fonts.googleapis.com/css2?family=Chewy&display=swap" rel="stylesheet">

<style>
    body {
        margin: 0;
        padding: 0;
        background: #FFDCE7;
        font-family: 'Chewy', cursive;
        display: flex;
        flex-direction: column;
        align-items: center;
        color: #7A3A2C;
    }

    h1 {
        font-size: 50px;
        margin-top: 15px;
        color: #FF7F99;
        text-shadow: 2px 2px #ffb4c9;
        letter-spacing: 3px;
    }

    .container {
        margin-top: 0.15px;
        width: 90%;
        max-width: 1200px;
        display: flex;
        gap: 40px;
    }

    .box {
        background: #FFCCCB;
        padding: 10px;
        border-radius: 35px;
        width: 100%;
        box-shadow: 0 6px 15px rgba(0,0,0,0.15);
        font-size: 22px;
        line-height: 1.5;
    }

    .box span { font-weight: bold; }

    .palette {
        width: 45%;
        display: flex;
        flex-wrap: wrap;
        gap: 25px;
        justify-content: center;
    }

    .color-item {
        text-align: center;
        font-size: 16px;
    }

    .circle {
        width: 70px;
        height: 70px;
        border-radius: 20%;
        box-shadow: 0 5px 12px rgba(0,0,0,0.25);
        margin-bottom: 5px;
    }

    .btn-area {
        margin-top: 20px;
        display: flex;
        gap: 20px;
        flex-wrap: wrap;
        justify-content: center;
    }

    .btn {
        padding: 10px 35px;
        border-radius: 40px;
        border: none;
        cursor: pointer;
        font-size: 20px;
        color: #fff;
        box-shadow: 0 6px rgba(0,0,0,0.2);
        transition: 0.2s;
        font-family: 'Chewy', cursive;
    }

    .btn:active {
        transform: translateY(4px);
        box-shadow: 0 2px rgba(0,0,0,0.2);
    }

    .view { background: #8AD4C1; }
    .retake { background: #496785; }
    .delete { background: #E94A4A; }
    .pdf { background: #F39BC2; }
    .docx { background: #A8D0FF; }
</style>
</head>
<body>

<h1 id="titleText">YOUR UNDERTONE RESULT</h1>

<div class="container">
    <div class="box" id="infoBox">
        <p><span>Undertone:</span> <span id="utValue">-</span></p>
        <p><span>Season:</span> <span id="snValue">-</span></p>

        <p><span>Foundation Recommendation:</span><br>
        <span id="foundation-text">-</span></p>

        <p><span>Lip Recommendation:</span><br>
        <span id="lip-text">-</span></p>

        <p><span>Palette:</span><br>
        <span id="palette-text">-</span></p>
    </div>

    <div class="palette" id="paletteBox"></div>
</div>

<div class="btn-area">
    <button class="btn view" onclick="goHistory()">VIEW HISTORY</button>
    <button class="btn retake" onclick="window.location.href='/cam_test'">Retake</button>
    <button class="btn delete" onclick="deleteHistory()">DELETE HISTORY</button>
</div>

<script>
// Ambil data dari localStorage
const undertone = localStorage.getItem("result_undertone") || "-";
const season = localStorage.getItem("result_season") || "-";

// Tampilkan di HTML
document.getElementById("utValue").innerText = undertone;
document.getElementById("snValue").innerText = season;

// Rekomendasi berdasarkan data
const FOUNDATION_MAP = {
    "Warm": "Maybelline Fit Me 220",
    "Cool": "Maybelline Fit Me 115",
    "Neutral": "Maybelline Fit Me 128"
};

const LIP_SHADES = {
    "Spring": "Peach Buff",
    "Summer": "Pink Sand",
    "Autumn": "Toasted Brown",
    "Winter": "Crimson Bold",
    "Neutral": "Nude Rose"
};

const PALETTES = {
    "Spring": ["Peach", "Coral"],
    "Summer": ["Soft Lilac", "Dusty Rose"],
    "Autumn": ["Terracotta", "Olive Green"],
    "Winter": ["Emerald", "Burgundy"],
    "Neutral": ["Classic Beige", "Taupe"]
};

// Tampilkan rekomendasi
document.getElementById("foundation-text").innerText = FOUNDATION_MAP[undertone] || "-";
document.getElementById("lip-text").innerText = LIP_SHADES[season] || "-";
document.getElementById("palette-text").innerText = PALETTES[season]?.join(", ") || "-";
// AMBIL HASIL
document.getElementById("utValue").innerText = localStorage.getItem("result_undertone") || "-";
document.getElementById("snValue").innerText = localStorage.getItem("result_season") || "-";

// ==============================
// FUNGSI TOMBOL
// ==============================

function goHistory() {
    window.location.href = "/history";
}

function retakePhoto() {
    document.getElementById("retakeBtn").addEventListener("click", () => {
        if (MODE === "undertone") {
            window.location.href = "/camera?mode=undertone";
        } else if (MODE === "personal") {
            window.location.href = "/camera?mode=personal";
        } else {
            // fallback kalau tidak ada mode
            window.location.href = "/cam_test";
        }
    });
}
retakePhoto();

function deleteHistory() {
    localStorage.removeItem("result_undertone");
    localStorage.removeItem("result_season");
    alert("History deleted!");
    window.location.href = "/cam_tes?mode=undertone";
}
</script>
</body>
</html>

 </div>
