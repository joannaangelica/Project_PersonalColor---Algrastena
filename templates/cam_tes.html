<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analyzer</title>

    <!-- FONT CHEWY -->
    <link href="https://fonts.googleapis.com/css2?family=Chewy&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f8dce5;
            font-family: "Chewy", cursive;
            text-align: center;
        }

        h1 {
            color: #ff8e8e;
            font-size: 55px;
            margin-top: 10px;
            letter-spacing: 3px;
        }

        .subtitle {
            font-family: Arial, sans-serif;
            font-size: 22px;
            color: #696969;
            margin-top: -30px;
            margin-bottom: 10px;
        }

        .camera-frame {
            width: 60%;
            height: 550px;
            background-color: #555;
            border-radius: 25px;
            margin: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            color: black;
            font-size: 28px;
        }

        video {
            width: 100%;
            height: 100%;
            border-radius: 25px;
            object-fit: cover;
            transform: scaleX(-1);
        }

        canvas {
            width: 100%;
            height: 100%;
            border-radius: 25px;
            display: none;
        }

        .big-btn {
            width: 40%;
            background-color: #ffb6d9;
            padding: 10px;
            font-size: 25px;
            border-radius: 35px;
            border: none;
            margin-top: 10px;
            cursor: pointer;
            box-shadow: 0px 4px 3px rgba(0,0,0,0.2);
        }

        .small-btn {
            padding: 14px 30px;
            font-size: 24px;
            border-radius: 35px;
            border: none;
            cursor: pointer;
            margin: 10px;
            font-family: "Chewy";
            box-shadow: 0px 4px 3px rgba(0,0,0,0.2);
        }

        .yellow { background-color: #ffe466; }
        .blue2 { background-color: #2c445a; color:white; }

        #resultButtons {
            display: none;
            margin-top: 20px;
        }

        .button-row {
            display: flex;
            justify-content: center;
        }

        .btn-green {
            width: 35%;
            padding: 10px;
            font-size: 25px;
            border-radius: 35px;
            border: none;
            background-color: #a7e1d0;
            cursor: pointer;
            margin-top: 20px;
            margin-right: 10px;
            box-shadow: 0px 4px 3px rgba(0,0,0,0.2);
        }

        .btn-red {
            width: 35%;
            padding: 10px;
            font-size: 25px;
            border-radius: 35px;
            border: none;
            background-color: #e94242;
            color:white;
            cursor: pointer;
            margin-top: 20px;
            margin-left: 10px;
            box-shadow: 0px 4px 3px rgba(0,0,0,0.2);
        }

        .created-by {
            margin-top: 60px;
            font-size: 15px;
            font-family: "Chewy";
            color: #ff8e8e;
            letter-spacing: 2px;
        }
    </style>
</head>

<body>

    <h1 id="titleText">ANALYZER</h1>

    <p class="subtitle" id="subtitleText">
        Activate the camera to start your analysis
    </p>

    <div class="camera-frame">
        <div id="placeholder">Camera</div>
        <video id="videoFeed" autoplay playsinline style="display:none;"></video>
        <canvas id="previewCanvas"></canvas>
    </div>

    <button class="big-btn" id="takePicBtn">TAKE A PICTURE & ANALYZE</button>

    <div id="resultButtons">
        <button class="small-btn blue2" onclick="analyzePhoto()">ANALYZE</button>
    </div>

    <div class="button-row">
        <button class="btn-green">VIEW HISTORY</button>
        <button class="btn-red">DELETE HISTORY</button>
    </div>

    <div class="created-by">Created by - Algrastena</div>

<script>

/* ====================================================
      SET TITLE (UNDERTONE / SEASON MODE)
==================================================== */
const params = new URLSearchParams(window.location.search);
const mode = params.get("mode") || "undertone";

if (mode === "undertone") {
    titleText.textContent = "UNDERTONE ANALYZER";
    subtitleText.textContent = "Activate the camera to start your undertone analyze";
} else {
    titleText.textContent = "PERSONAL COLOUR ANALYZER";
    subtitleText.textContent = "Activate the camera to start your personal colour analyze";
}


/* ====================================================
      CAMERA SETUP
==================================================== */
const video = document.getElementById("videoFeed");
const canvas = document.getElementById("previewCanvas");
const ctx = canvas.getContext("2d");
const placeholder = document.getElementById("placeholder");

navigator.mediaDevices.getUserMedia({ video: true })
.then(stream => {
    video.style.display = "block";
    placeholder.style.display = "none";
    video.srcObject = stream;
})
.catch(err => {
    placeholder.textContent = "Camera not available";
});


/* ====================================================
      TAKE PICTURE
==================================================== */
document.getElementById("takePicBtn").onclick = function () {

    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;

    ctx.save();
    ctx.scale(-1, 1);
    ctx.drawImage(video, -canvas.width, 0, canvas.width, canvas.height);
    ctx.restore();

    video.style.display = "none";
    canvas.style.display = "block";
    document.getElementById("resultButtons").style.display = "block";
};


function retakePhoto() {
document.getElementById("retakeBtn").addEventListener("click", () => {
    window.location.href = "/cam_test";
});
}

/* ====================================================
      ANALYZE PHOTO (KIRIM KE FLASK)
==================================================== */
function analyzePhoto() {

    let imageData = canvas.toDataURL("image/png");

    fetch("/analyze_image", {
        method: "POST",
        headers: { "Content-Type": "application/json"},
        body: JSON.stringify({ image: imageData })
    })
    .then(res => res.json())
    .then(data => {

        localStorage.setItem("result_undertone", data.undertone);
        localStorage.setItem("result_season", data.season);

        if (mode === "undertone") {
            window.location.href = "/result_undertone";
        } else {
            window.location.href = "/result_season";
        }
    })
    .catch(err => {
        console.error(err);
        alert("Error processing image.");
    });
}

</script>
</body>
</html>
