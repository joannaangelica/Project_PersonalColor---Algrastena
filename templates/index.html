<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glow Finder - Sign Up</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chewy&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div class="header">
        <h1><span class="ribbon">🎀</span> GLOW FINDER <span class="ribbon">🎀</span></h1>
        
        <div class="ribbon-strip">
            <div class="divider"></div>
        </div>
    </div>
    
    <div class="content-wrapper">
        
        <form class="signup-box" id="signupForm">
            
            <div class="bubble bubble-1"></div>
            <div class="bubble bubble-2"></div>

            <h2>SIGN UP</h2>
            
            <div class="form-content">
                <div class="input-group">
                    <input type="text" id="name" name="name" placeholder="NAME" required>
                </div>
                <div class="input-group">
                    <input type="number" id="age" name="age" placeholder="AGE" required>
                </div>
                <div class="input-group">
                    <input type="email" id="email" name="email" placeholder="E-MAIL" required>
                </div>

                <button type="submit">START</button>
            </div>
        </form>
    </div>
        <div class="created-by">Created by - Algrastena</div>
    </div>
    <!-- ============================= -->
    <!-- JAVASCRIPT – ARAHIN KE CHOOSE -->
    <!-- ============================= -->
        <script>
        document.getElementById("signupForm").addEventListener("submit", function(event) {
            event.preventDefault();

            let name = document.getElementById("name").value;
            let age = document.getElementById("age").value;
            let email = document.getElementById("email").value;

            localStorage.setItem("user_name", name);
            localStorage.setItem("user_age", age);
            localStorage.setItem("user_email", email);

            window.location.href = "/choose";  // ke choose.html
        });
    </script>

</body>
</html>
